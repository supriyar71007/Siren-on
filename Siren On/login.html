<!DOCTYPE html>
<html>
<head>

    <title>SirenLink - Control Room Login</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 15px #aaa;
        }

        h1 {
            color: #222;
        }

        h2 {
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 13px;
            margin: 10px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 7px;
        }

        button {
            width: 95%;
            padding: 14px;
            margin-top: 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca3;
        }

        #error {
            color: red;
            display: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>🚦 SirenLink</h1>

    <h2>Control Room Login</h2>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        SIGN IN
    </button>

    <p id="error">
        ❌ Invalid Username or Password
    </p>

</div>


<script>

function login() {

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;


    // Demo username and password

    if (username === "admin" &&
        password === "1234") {

        // Open SirenLink main page

        window.location.href = "index.html";

    }

    else {

        document.getElementById("error")
            .style.display = "block";

    }

}

</script>

</body>
</html>
